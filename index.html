<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Min Togtavle</title>
    <style>
        body { 
            background-color: #040d21; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }
        .skaerm {
            width: 100%;
            max-width: 480px;
            background: #020714;
            border: 2px solid #1a2a4a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        .header {
            border-bottom: 2px solid #1a2a4a;
            padding-bottom: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .klokken {
            font-size: 1.4em;
            font-weight: bold;
            font-family: monospace;
            color: #ffffff;
            background: #0a1b3a;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .station-navn {
            font-size: 1.1em;
            color: #8da2cb;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .tog-raekke {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #051330;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 6px solid #e30613;
        }
        .linje-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ikon-b {
            background: #e30613;
            color: white;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
        }
        .destination {
            font-size: 1.1em;
            font-weight: 500;
        }
        .tid-og-spor {
            text-align: right;
        }
        .minutter {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffcc00;
        }
        .klokkeslaet {
            font-size: 0.85em;
            color: #8da2cb;
            margin-top: 2px;
        }
        .forsinket {
            color: #ff3333 !important;
        }
        .spor {
            font-size: 0.8em;
            background: #1a2a4a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffffff;
            display: inline-block;
            margin-top: 4px;
        }
        .ingen-tog {
            text-align: center;
            padding: 30px;
            color: #8da2cb;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="skaerm">
        <div class="header">
            <div class="station-navn">Høje Taastrup</div>
            <div id="live-ur" class="klokken">00:00</div>
        </div>
        <div id="tog-liste">Henter live-data...</div>
    </div>

    <script>
        // Ny API 2.0 URL + en offentlig CORS-proxy for at undgå forbindelsesfejl i browseren
        const renUrl = "https://rejseplanen.dk";
        const proxyUrl = "https://allorigins.win" + encodeURIComponent(renUrl);

        function opdaterUr() {
            const nu = new Date();
            const timer = String(nu.getHours()).padStart(2, '0');
            const minutter = String(nu.getMinutes()).padStart(2, '0');
            document.getElementById('live-ur').innerText = `${timer}:${minutter}`;
        }

        const definerMinutterTil = (togTidStr) => {
            const nu = new Date();
            const [timer, minutter] = togTidStr.split(':').map(Number);
            const togTid = new Date();
            togTid.setHours(timer, minutter, 0, 0);
            
            if (togTid < nu && (nu - togTid) > 12 * 60 * 60 * 1000) {
                togTid.setDate(togTid.getDate() + 1);
            }

            const forskelMs = togTid - nu;
            return Math.ceil(forskelMs / 1000 / 60);
        };

        async function hentTogData() {
            try {
                const response = await fetch(proxyUrl);
                const proxyData = await response.json();
                
                // Allorigins pakker svaret ind i et 'contents' felt som tekst, der skal parses til JSON
                const data = JSON.parse(proxyData.contents);
                const departures = data.DepartureBoard.Departure || [];
                
                let html = "";
                let fundetTog = false;
                
                departures.forEach(dep => {
                    if (dep.name === "S-tog B" && dep.direction.includes("Farum")) {
                        fundetTog = true;
                        
                        const planlagtTid = dep.time;
                        const realTid = dep.rtTime;
                        const spor = dep.track || "-";
                        
                        const aktuelTid = realTid ? realTid : planlagtTid;
                        const minutterTil = definerMinutterTil(aktuelTid);
                        
                        let visningMinutter = minutterTil <= 0 ? "Nu" : `${minutterTil} min`;
                        let statusKlasse = (realTid && realTid !== planlagtTid) ? "forsinket" : "";

                        html += `
                            <div class="tog-raekke">
                                <div class="linje-info">
                                    <div class="ikon-b">B</div>
                                    <div class="destination">Farum</div>
                                </div>
                                <div class="tid-og-spor">
                                    <div class="minutter ${statusKlasse}">${visningMinutter}</div>
                                    <div class="klokkeslaet">Kl. ${aktuelTid}</div>
                                    <div><span class="spor">Spor ${spor}</span></div>
                                </div>
                            </div>
                        `;
                    }
                });
                
                document.getElementById('tog-liste').innerHTML = fundetTog ? html : '<div class="ingen-tog">Ingen planlagte tog mod Farum lige nu</div>';
                
            } catch (error) {
                console.error(error);
                document.getElementById('tog-liste').innerHTML = '<div class="ingen-tog" style="color:#ff3333;">Kunne ikke hente data...</div>';
            }
        }

        setInterval(opdaterUr, 1000);
        setInterval(hentTogData, 30000); // Opdaterer hvert 30. sekund
        opdaterUr();
        hentTogData();
    </script>
</body>
</html>
